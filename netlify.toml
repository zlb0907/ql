# Netlify配置文件 - 情侣同步观影应用

[build]
  # 静态站点部署，不需要构建
  command = ""
  publish = "."

# SPA路由支持
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全头设置
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 静态资源缓存
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# API代理配置（用于后端服务）
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-service.onrender.com/api/:splat"
  status = 200

# WebSocket代理配置
[[redirects]]
  from = "/ws"
  to = "wss://your-backend-service.onrender.com"
  status = 200